<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Georgia, serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(24, 15, 9, 0.58), rgba(24, 15, 9, 0.72)), url('https://img.magnific.com/free-photo/coffee-beans-dark-background-top-view-coffee-concept_1220-6299.jpg') center / cover fixed;
            color: #2b1a12;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 18px 20px;
            background: rgba(28, 17, 11, 0.94);
            border-bottom: 1px solid rgba(244, 213, 167, 0.25);
        }

        nav a {
            color: #f8e7cb;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 999px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        nav a:hover,
        nav a.active {
            background: #c98b52;
            color: #21120b;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 56px auto;
            background: rgba(255, 248, 237, 0.96);
            padding: 34px;
            border: 1px solid rgba(244, 213, 167, 0.7);
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #795d4c;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5b99b;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #6d3f27;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #9a6136;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f3e1c9;
            border-radius: 10px;
            text-align: center;
        }

        .sku {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .error {
            color: red;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <nav>
        <a class="active" href="index.html">SKU Generator</a>
        <a href="receipt.html">Receipt Generator</a>
    </nav>

    <div class="container">

        <h1>SKU Generator</h1>

        <p class="description">
            Generate a unique Stock Keeping Unit using the product
            category, product name, and stock quantity.
        </p>

        <label for="category">Product Category</label>

        <select id="category">
            <option value="CF">coffee</option>
            <option value="ICF">ice coffee</option>
            <option value="TEA">tea</option>
            <option value="P">pastries</option>
            <option value="F">frapachno  </option>
            <option value="SK">snacks</option>

        </select>

        <label for="product">Product Name</label>

        <input
            type="text"
            id="product"
            placeholder="Example: americano"
        >

        <label for="stock">Stock Quantity</label>

        <input
            type="number"
            id="stock"
            placeholder="Example: 25"
            min="1"
        >

        <button py-click="generate_sku">
            Generate SKU
        </button>

        <div class="error" id="error"></div>

        <div class="result">
            <div>Generated SKU</div>

            <div class="sku" id="sku">
                ---
            </div>
        </div>

    </div>


    <py-script src="main1.py"></py-script>
</body>
</html>
